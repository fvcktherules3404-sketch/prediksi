name: Daily Predictions

on:
  schedule:
    # 23:00 UTC = 06:00 WIB. Catatan: GitHub Actions scheduled workflow TIDAK dijamin
    # jalan tepat waktu (bisa telat). Karena itu script memakai waktu eksekusi aktual
    # untuk menentukan window: 06:00 WIB terakhir s/d +24 jam (05:59:59 WIB).
    - cron: '0 23 * * *'
  workflow_dispatch:   # GitHub -> Actions -> Daily Predictions -> Run workflow
    inputs:
      backfill_days:
        description: 'Isi data awal: berapa hari ke belakang (hanya jika data/results.json masih kosong)'
        default: '5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Generate predictions
        continue-on-error: true      # kalau gagal, prediksi lama tetap dipakai & situs tetap deploy
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '5' }}
        run: npm run predict
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || (git commit -m "chore: update predictions $(date -u +%F)" && git pull --rebase -q && git push)
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: predict-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
