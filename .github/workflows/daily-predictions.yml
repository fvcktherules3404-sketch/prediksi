name: Daily Predictions

on:
  schedule:
    # Kuota API-Football reset 00:00 UTC (07:00 WIB). Sesi pagi dijalankan SETELAH reset supaya
    # kuota penuh (sebelumnya jam 06:00 WIB masih memakai sisa kuota kemarin -> habis).
    # Catatan: GitHub Actions scheduled workflow TIDAK dijamin jalan tepat waktu (bisa telat). Karena itu script
    # memakai waktu eksekusi aktual untuk menentukan window: 06:00 WIB terakhir s/d +24 jam.
    - cron: '30 22 * * *'  # run dini: 05:30 WIB, hanya laga 06:00-08:00 (masih kuota hari kemarin UTC; ringan, cache & odds run malam dipakai ulang)
    - cron: '10 0 * * *'   # sesi pagi: 07:10 WIB (laga 06:00 - 20:59)
    - cron: '0 14 * * *'   # sesi malam: 21:00 WIB (laga 21:00 - 05:59)
  workflow_dispatch:   # GitHub -> Actions -> Daily Predictions -> Run workflow
    inputs:
      backfill_days:
        description: 'Isi data awal: berapa hari ke belakang (hanya jika data/results.json masih kosong)'
        default: '5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Generate predictions
        continue-on-error: true      # kalau gagal, prediksi lama tetap dipakai & situs tetap deploy
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          FOOTBALL_API_KEY_2: ${{ secrets.FOOTBALL_API_KEY_2 }}   # opsional; kosong = diabaikan
          FOOTBALL_API_KEY_3: ${{ secrets.FOOTBALL_API_KEY_3 }}   # opsional
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_2: ${{ secrets.TAVILY_API_KEY_2 }}       # opsional; kosong = diabaikan
          TAVILY_API_KEY_3: ${{ secrets.TAVILY_API_KEY_3 }}       # opsional
          BACKFILL_DAYS: ${{ inputs.backfill_days || '5' }}
          ALL_LEAGUES: 'false'        # hanya liga pilihan (lihat DEFAULT_LEAGUES di scripts/config.ts)
          ODDS_MAX_REQUESTS: '15'     # odds diurutkan menurut prioritas liga
        run: npm run predict
      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data data
          git diff --cached --quiet || (git commit -m "chore: update predictions $(date -u +%F)" && git pull --rebase -q && git push)
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: predict-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4