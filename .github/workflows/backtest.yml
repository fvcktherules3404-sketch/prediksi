name: Backtest

# Dijalankan MANUAL: GitHub -> Actions -> Backtest -> Run workflow.
# Membaca CSV di data/backtest/ (subfolder 2526/, 2627/ ikut terbaca), lalu menyimpan hasilnya ke
# docs/backtest-results/ (teks + JSON) supaya bisa dibaca langsung di GitHub.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Yang dijalankan: club, intl, atau both'
        default: 'both'
      warmup:
        description: 'Laga pemanasan Elo per tim'
        default: '20'

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240          # backtest klub (±28 ribu laga) bisa puluhan menit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund

      - name: Backtest klub
        if: ${{ inputs.target == 'club' || inputs.target == 'both' }}
        run: |
          set -o pipefail
          mkdir -p docs/backtest-results
          npm run backtest -- --dir=data/backtest --only=club --warmup=${{ inputs.warmup }} \
            --out=docs/backtest-results/club.json | tee docs/backtest-results/club.txt

      - name: Backtest tim nasional
        if: ${{ inputs.target == 'intl' || inputs.target == 'both' }}
        run: |
          set -o pipefail
          mkdir -p docs/backtest-results
          npm run backtest -- --dir=data/backtest --only=intl --from=2010 --warmup=${{ inputs.warmup }} \
            --out=docs/backtest-results/intl.json | tee docs/backtest-results/intl.txt

      - name: Ringkasan di halaman run
        if: always()
        run: |
          for f in club intl; do
            if [ -f docs/backtest-results/$f.txt ]; then
              echo "## Backtest $f" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -v "csv:" docs/backtest-results/$f.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Commit hasil
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/backtest-results
          git diff --cached --quiet || (git commit -m "chore: hasil backtest $(date -u +%F)" && git pull --rebase -q && git push)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: docs/backtest-results